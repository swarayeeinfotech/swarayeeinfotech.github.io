<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="title desc">
  <title id="title">Swarayee Infotech vector logo</title>
  <desc id="desc">Scalable vector logo with education, technology, and growth symbol plus SWARAYEE INFOTECH wordmark.</desc>

  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a315e"/>
      <stop offset="1" stop-color="#124d87"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c5fa8"/>
      <stop offset="1" stop-color="#187fc5"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="0.55" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#f06a00"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(25 12)">
    <!-- outer hexagonal technology frame -->
    <path d="M120 10 L220 68 L220 184 L120 242 L20 184 L20 68 Z"
          fill="none" stroke="url(#navy)" stroke-width="16"
          stroke-linejoin="round"/>
    <path d="M120 35 L195 78 L195 169 L120 212 L45 169 L45 78 Z"
          fill="none" stroke="#0d568f" stroke-width="8"
          stroke-linejoin="round" opacity=".9"/>

    <!-- orange learning / growth figure -->
    <path d="M117 188
             C104 165 102 143 111 122
             C120 101 140 86 160 73
             C150 98 154 118 172 137
             C188 154 183 180 160 195
             C145 204 128 200 117 188 Z"
          fill="url(#orange)"/>
    <path d="M127 90
             C137 73 148 60 163 45
             C166 68 176 82 189 94
             C176 93 164 99 154 109
             C146 100 137 94 127 90 Z"
          fill="#ff9b00"/>
    <circle cx="139" cy="86" r="10" fill="#ffb000"/>

    <!-- open book -->
    <path d="M36 174
             C67 158 95 160 120 174
             C145 160 173 158 204 174
             L204 218
             C173 203 145 204 120 219
             C95 204 67 203 36 218 Z"
          fill="none" stroke="url(#blue)" stroke-width="9"
          stroke-linejoin="round"/>
    <path d="M120 174 V219" fill="none" stroke="#0a5c9e" stroke-width="8"/>
    <path d="M48 184 C73 173 96 175 112 184
             M128 184 C145 175 168 173 192 184"
          fill="none" stroke="#1d79bb" stroke-width="5"
          stroke-linecap="round"/>

    <!-- digital pixels -->
    <g fill="#0e6cb0">
      <rect x="2" y="75" width="13" height="13" rx="2"/>
      <rect x="0" y="97" width="9" height="9" rx="2" opacity=".85"/>
      <rect x="18" y="58" width="12" height="12" rx="2" fill="#ff9a00"/>
      <rect x="30" y="38" width="10" height="10" rx="2" fill="#176eae"/>
      <rect x="8" y="119" width="12" height="12" rx="2" fill="#ff9a00"/>
      <rect x="27" y="112" width="9" height="9" rx="2"/>
    </g>

    <!-- graduation cap -->
    <path d="M64 76 L120 45 L176 76 L120 107 Z"
          fill="url(#navy)"/>
    <path d="M88 93 V119
             C106 129 134 129 152 119 V93"
          fill="#0e4f86" opacity=".8"/>
    <path d="M176 76 V110" stroke="#0a315e" stroke-width="5"/>
    <circle cx="176" cy="115" r="5" fill="#ff9a00"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(285 85)">
    <text x="0" y="62"
          font-family="Arial, Helvetica, sans-serif"
          font-size="74" font-weight="800"
          letter-spacing="2.5"
          fill="url(#navy)">SWARAYEE</text>

    <text x="595" y="62"
          font-family="Arial, Helvetica, sans-serif"
          font-size="50" font-weight="700"
          letter-spacing="3"
          fill="#1b4d7f">INFOTECH</text>

    <!-- accent rule -->
    <rect x="0" y="82" width="780" height="4" rx="2" fill="#f28a00"/>

    <text x="0" y="130"
          font-family="Arial, Helvetica, sans-serif"
          font-size="28" font-weight="500"
          letter-spacing=".2"
          fill="#6f7f93">Swarayee Comps &amp; Infotech</text>

    <text x="0" y="172"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="600"
          letter-spacing="1.2"
          fill="#0d4f86">EDUCATION • TECHNOLOGY • DIGITAL SERVICES</text>

    <g transform="translate(0 204)">
      <rect x="0" y="0" width="32" height="3" rx="1.5" fill="#f28a00"/>
      <text x="44" y="7"
            font-family="Arial, Helvetica, sans-serif"
            font-size="16" font-weight="600"
            letter-spacing="1.5"
            fill="#466b8e">SOLUTIONS | SUPPORT | SUCCESS</text>
      <rect x="390" y="0" width="32" height="3" rx="1.5" fill="#f28a00"/>
    </g>
  </g>
</svg>
