<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="650" viewBox="0 0 1920 650"
     role="img" aria-labelledby="title desc">
  <title id="title">Swarayee subtle 2D vector footer background</title>
  <desc id="desc">Monochrome tonal watermark-style education and digital technology illustration on a deep navy background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b52"/>
      <stop offset="1" stop-color="#031a34"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a72b8"/>
      <stop offset="0.5" stop-color="#0d4f8a"/>
      <stop offset="1" stop-color="#1689d5"/>
    </linearGradient>

    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa7df" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1e6ea7" stop-opacity=".10"/>
    </linearGradient>

    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#5eb4e7" opacity=".08"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="rounded">
      <rect x="0" y="0" width="1920" height="650" rx="0"/>
    </clipPath>
  </defs>

  <rect width="1920" height="650" fill="url(#bg)"/>
  <rect x="0" y="0" width="420" height="300" fill="url(#dots)"/>
  <rect x="1500" y="0" width="420" height="320" fill="url(#dots)"/>

  <!-- LEFT: education watermark -->
  <g opacity=".8">
    <!-- open book -->
    <path d="M65 500
             C120 465, 185 458, 252 485
             C315 458, 382 468, 438 505
             L438 555
             C370 525, 315 525, 252 552
             C188 526, 128 526, 65 555 Z"
          fill="url(#sil)" stroke="#4fa7df" stroke-opacity=".14" stroke-width="4"/>
    <path d="M252 485 L252 552" stroke="#7bc3ee" stroke-opacity=".11" stroke-width="4"/>
    <path d="M88 510 C145 486, 190 489, 235 507" fill="none"
          stroke="#7bc3ee" stroke-opacity=".11" stroke-width="4"/>
    <path d="M275 507 C322 488, 365 490, 415 514" fill="none"
          stroke="#7bc3ee" stroke-opacity=".11" stroke-width="4"/>

    <!-- abstract graduate -->
    <circle cx="206" cy="257" r="55" fill="#4fa7df" opacity=".13"/>
    <path d="M160 337
             C175 302, 212 287, 245 299
             C287 315, 315 350, 332 391
             L300 400
             C279 366, 255 346, 224 339
             C206 364, 185 386, 153 405
             L128 375 Z"
          fill="url(#sil)"/>
    <!-- arm / uplift -->
    <path d="M252 315
             C314 281, 343 246, 360 194
             L382 205
             C371 270, 329 329, 278 358 Z"
          fill="#4fa7df" opacity=".17"/>
    <!-- cap -->
    <path d="M134 218 L208 177 L282 218 L208 259 Z"
          fill="#4fa7df" opacity=".20"/>
    <path d="M208 259 V284" stroke="#65b6e8" stroke-opacity=".16" stroke-width="6"/>
    <circle cx="208" cy="287" r="5" fill="#65b6e8" opacity=".16"/>
    <!-- star -->
    <path d="M382 146
             l10 28 30 2 -23 19 8 30 -25 -16 -25 16 8 -30 -23 -19 30 -2z"
          fill="#7bc3ee" opacity=".20"/>
    <!-- page swooshes -->
    <path d="M58 558 C170 620, 330 625, 492 562"
          fill="none" stroke="url(#wave)" stroke-opacity=".20" stroke-width="10"/>
    <path d="M72 580 C190 635, 328 637, 500 580"
          fill="none" stroke="#2f9fe0" stroke-opacity=".10" stroke-width="4"/>
  </g>

  <!-- MID-LEFT: soft slogan watermark -->
  <g transform="translate(360 240)" opacity=".12" fill="#62b7ea" font-family="Arial, sans-serif">
    <text x="0" y="0" font-size="42" font-weight="700">Learn</text>
    <text x="0" y="54" font-size="42" font-weight="700">Skill</text>
    <text x="0" y="108" font-size="42" font-weight="700">Grow</text>
    <line x1="0" y1="126" x2="140" y2="126" stroke="#62b7ea" stroke-width="4"/>
  </g>

  <!-- RIGHT: digital network watermark -->
  <g opacity=".8">
    <!-- globe -->
    <circle cx="1585" cy="267" r="124" fill="none" stroke="#55aee2" stroke-opacity=".16" stroke-width="5"/>
    <ellipse cx="1585" cy="267" rx="55" ry="124" fill="none" stroke="#55aee2" stroke-opacity=".12" stroke-width="4"/>
    <ellipse cx="1585" cy="267" rx="96" ry="124" fill="none" stroke="#55aee2" stroke-opacity=".10" stroke-width="3"/>
    <path d="M1462 267 H1708 M1476 215 H1694 M1476 319 H1694"
          fill="none" stroke="#55aee2" stroke-opacity=".10" stroke-width="4"/>
    <!-- orbit -->
    <ellipse cx="1585" cy="267" rx="185" ry="82" fill="none"
             stroke="#3f9ed7" stroke-opacity=".10" stroke-width="4"/>
    <circle cx="1430" cy="280" r="9" fill="#63b9ea" opacity=".18"/>
    <circle cx="1742" cy="234" r="9" fill="#63b9ea" opacity=".18"/>
    <circle cx="1638" cy="174" r="8" fill="#63b9ea" opacity=".16"/>

    <!-- icon circles -->
    <g fill="none" stroke="#6ab9e7" stroke-opacity=".13" stroke-width="5">
      <circle cx="1455" cy="132" r="48"/>
      <circle cx="1718" cy="125" r="48"/>
      <circle cx="1780" cy="275" r="48"/>
      <circle cx="1408" cy="360" r="48"/>
    </g>

    <!-- cloud icon -->
    <g fill="none" stroke="#6ab9e7" stroke-opacity=".16" stroke-width="7">
      <path d="M1426 142 C1410 142 1398 131 1398 116 C1398 98 1414 84 1433 85
               C1441 68 1456 59 1475 62 C1497 66 1510 83 1510 104
               C1510 124 1494 142 1474 142 Z"/>
    </g>

    <!-- wifi -->
    <g fill="none" stroke="#6ab9e7" stroke-opacity=".15" stroke-linecap="round">
      <path d="M1690 116 C1705 99 1731 99 1747 116" stroke-width="6"/>
      <path d="M1699 131 C1708 121 1728 121 1738 131" stroke-width="6"/>
      <circle cx="1719" cy="144" r="5" fill="#6ab9e7" stroke="none"/>
    </g>

    <!-- people -->
    <g fill="none" stroke="#6ab9e7" stroke-opacity=".15" stroke-width="6">
      <circle cx="1780" cy="257" r="11"/>
      <circle cx="1761" cy="263" r="9"/>
      <circle cx="1800" cy="263" r="9"/>
      <path d="M1756 286 C1759 274 1772 270 1780 270 C1788 270 1801 274 1804 286"/>
      <path d="M1743 282 C1744 274 1752 270 1759 271"/>
      <path d="M1801 271 C1808 270 1816 274 1817 282"/>
    </g>

    <!-- gear -->
    <g transform="translate(1408 360)" stroke="#6ab9e7" stroke-opacity=".14" fill="none" stroke-width="6">
      <circle r="16"/>
      <path d="M0-31 V-20 M0 20 V31 M-31 0 H-20 M20 0 H31 M-22-22 L-14-14 M14 14 L22 22 M22-22 L14-14 M-14 14 L-22 22"/>
    </g>

    <!-- monitor -->
    <g transform="translate(1360 365)" opacity=".85">
      <rect x="0" y="0" width="210" height="128" rx="10"
            fill="#4fa7df" fill-opacity=".08" stroke="#59b2e7" stroke-opacity=".14" stroke-width="5"/>
      <rect x="18" y="18" width="174" height="88" fill="none"
            stroke="#59b2e7" stroke-opacity=".08" stroke-width="4"/>
      <path d="M95 132 H115 V150 H95 Z" fill="#59b2e7" fill-opacity=".10"/>
      <rect x="74" y="150" width="62" height="7" rx="3.5" fill="#59b2e7" fill-opacity=".10"/>
      <!-- bars -->
      <rect x="48" y="77" width="18" height="29" fill="#62b7ea" opacity=".12"/>
      <rect x="79" y="61" width="18" height="45" fill="#62b7ea" opacity=".14"/>
      <rect x="110" y="45" width="18" height="61" fill="#62b7ea" opacity=".16"/>
      <rect x="141" y="28" width="18" height="78" fill="#62b7ea" opacity=".18"/>
    </g>

    <!-- growth arrow -->
    <path d="M1550 505 C1645 456 1715 413 1815 330" fill="none"
          stroke="#5eb7e8" stroke-opacity=".16" stroke-width="9"/>
    <path d="M1788 332 L1818 328 L1812 358" fill="none"
          stroke="#5eb7e8" stroke-opacity=".16" stroke-width="9"/>
    <g fill="#5eb7e8" opacity=".10">
      <rect x="1582" y="482" width="32" height="23" rx="3"/>
      <rect x="1628" y="457" width="32" height="48" rx="3"/>
      <rect x="1674" y="425" width="32" height="80" rx="3"/>
      <rect x="1720" y="392" width="32" height="113" rx="3"/>
    </g>
  </g>

  <!-- subtle center watermark ring and nodes -->
  <g opacity=".09" fill="none" stroke="#67bbed">
    <circle cx="960" cy="260" r="170" stroke-width="2"/>
    <circle cx="960" cy="260" r="215" stroke-width="1"/>
  </g>
  <g fill="#67bbed" opacity=".10">
    <circle cx="770" cy="195" r="5"/>
    <circle cx="1130" cy="182" r="5"/>
    <circle cx="790" cy="360" r="4"/>
    <circle cx="1115" cy="355" r="4"/>
  </g>

  <!-- bottom wave ribbons -->
  <g clip-path="url(#rounded)">
    <path d="M-80 560 C250 500, 470 635, 780 595 C1070 555, 1240 530, 1490 575 C1670 606, 1800 650, 2000 588"
          fill="none" stroke="#0d6ead" stroke-opacity=".22" stroke-width="42"/>
    <path d="M-80 558 C250 498, 470 620, 780 585 C1070 548, 1240 520, 1490 565 C1670 596, 1800 640, 2000 578"
          fill="none" stroke="#2197d7" stroke-opacity=".16" stroke-width="12"/>
    <path d="M-80 580 C250 520, 470 640, 790 605 C1080 568, 1240 540, 1495 585 C1675 616, 1810 660, 2000 600"
          fill="none" stroke="#4ab0e5" stroke-opacity=".08" stroke-width="5"/>
    <path d="M-40 602 C270 550, 480 660, 800 625 C1110 590, 1270 565, 1510 608 C1685 640, 1830 680, 1980 620"
          fill="none" stroke="#5bb9ea" stroke-opacity=".06" stroke-width="3"/>
  </g>

  <!-- Very subtle side vignette -->
  <rect width="1920" height="650" fill="url(#bg)" opacity=".05"/>
</svg>
